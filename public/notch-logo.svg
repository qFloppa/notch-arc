<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a9ab0"/>
      <stop offset="40%" stop-color="#c8d4e0"/>
      <stop offset="55%" stop-color="#e2eaf2"/>
      <stop offset="75%" stop-color="#b0bfce"/>
      <stop offset="100%" stop-color="#7a8a9a"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5bbf"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#4a9aff"/>
      <stop offset="100%" stop-color="#1a4fa0"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60748a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a4d60" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="pill">
      <rect x="8" y="0" width="64" height="108" rx="32"/>
    </clipPath>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Body -->
  <g filter="url(#shadow)">
    <!-- Metal body top portion -->
    <rect x="8" y="0" width="64" height="88" rx="32" fill="url(#body)"/>
    <!-- Blue base -->
    <rect x="8" y="76" width="64" height="32" rx="0" fill="url(#base)" clip-path="url(#pill)"/>
    <!-- Pill clip for base rounding -->
    <rect x="8" y="76" width="64" height="44" rx="32" fill="url(#base)"/>
  </g>

  <!-- Center seam (vertical divider) -->
  <rect x="38.5" y="4" width="3" height="100" rx="1.5" fill="url(#seam)"/>

  <!-- Tally notches — 7 rows of horizontal cuts through the seam -->
  <!-- Each notch: two slots flanking the seam -->
  <g fill="#1a2533">
    <!-- Row 1 -->
    <rect x="14" y="14" width="20" height="5" rx="2.5"/>
    <rect x="46" y="14" width="20" height="5" rx="2.5"/>
    <!-- Row 2 -->
    <rect x="14" y="24" width="20" height="5" rx="2.5"/>
    <rect x="46" y="24" width="20" height="5" rx="2.5"/>
    <!-- Row 3 -->
    <rect x="14" y="34" width="20" height="5" rx="2.5"/>
    <rect x="46" y="34" width="20" height="5" rx="2.5"/>
    <!-- Row 4 -->
    <rect x="14" y="44" width="20" height="5" rx="2.5"/>
    <rect x="46" y="44" width="20" height="5" rx="2.5"/>
    <!-- Row 5 -->
    <rect x="14" y="54" width="20" height="5" rx="2.5"/>
    <rect x="46" y="54" width="20" height="5" rx="2.5"/>
    <!-- Row 6 -->
    <rect x="14" y="64" width="20" height="5" rx="2.5"/>
    <rect x="46" y="64" width="20" height="5" rx="2.5"/>
    <!-- Row 7 -->
    <rect x="14" y="74" width="20" height="5" rx="2.5"/>
    <rect x="46" y="74" width="20" height="5" rx="2.5"/>
  </g>

  <!-- Specular highlight on metal -->
  <rect x="22" y="4" width="8" height="80" rx="4" fill="white" opacity="0.08"/>
</svg>
